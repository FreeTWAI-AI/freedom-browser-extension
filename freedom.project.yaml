  "schema_version": "freedom.project/v1",
  "kind": "Project",
  "project_id": "project:freedom-browser-extension",
  "slug": "freedom-browser-extension",
  "name": "Freedom Browser Extension",
  "summary": "Chrome extension that pairs a browser to Freedom Workshop with session-only bootstrap credentials.",
  "project_type": "application",
  "lifecycle": "incubating",
  "description": {
    "problem": "Members need a standard Chrome extension that can pair a browser to Freedom Workshop, hold only session-scoped bootstrap credentials, and reject untyped or cross-site messages. This repository is that extension. It does not run models or act on page DOM yet.",
    "audiences": [
      "Freedom Workshop members pairing a browser",
      "Maintainers of the extension"
    ],
    "capabilities": [
      "Pair this browser with Freedom Workshop using the device-authorization bootstrap and DPoP proofs",
      "Keep access and refresh tokens in chrome.storage.session and a nonextractable device key in IndexedDB",
      "Validate extension messages by schema, sender, frame, document, origin and session epoch",
      "Grant or remove site host permissions one origin at a time from a side-panel gesture",
      "Show extension_byok as available without a Native Host, and extension_cli as missing when no host answers"
    ],
    "limitations": [
      "No Native Host, DOM actions, durable journal, Stop or takeover, model runs, store listing or deployment",
      "client_id freedom-browser-extension is a placeholder until the platform registers an extension client",
      "Session tokens live only in chrome.storage.session. The manifest schema cannot name that store; they are not the plaintext file-cache exception",
      "The device key is a nonextractable P-256 CryptoKey in IndexedDB. credential_root_key_storage client_owned names that client key, not a PostgreSQL vault",
      "No provider keys, customer data or payment data are stored",
      "A browser restart drops session tokens and requires pairing again. No hardware attestation or OS isolation is claimed",
      "NOASSERTION means licensing is undecided; this metadata grants no reuse rights",
      "Quality and release fields declare policy only. They are not a signed release or a store review"
    ]
  },
